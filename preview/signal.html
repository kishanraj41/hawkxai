<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HawkxAI — SIGNAL style preview</title>
  <style>
    :root {
      --void: #05060a;
      --panel: #0a0e17;
      --line: #1c2333;
      --ink: #f4f1ea;
      --mute: #7c8598;
      --slate-fill: #2a3245;
      --slate-stroke: #46506b;
      --amber: #ffb24d;
      --amber-hot: #ff7a18;
      --grid: rgba(148, 163, 184, 0.05);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--void);
      caret-color: var(--amber);
    }
    .signal-void {
      position: absolute;
      inset: 0;
      background-color: var(--void);
      background-image:
        radial-gradient(circle at 50% 54%, transparent 11.6%, var(--grid) 12%, transparent 12.4%),
        radial-gradient(circle at 50% 54%, transparent 23.6%, var(--grid) 24%, transparent 24.4%),
        radial-gradient(circle at 50% 54%, transparent 35.6%, var(--grid) 36%, transparent 36.4%),
        radial-gradient(circle at 50% 54%, transparent 47.6%, var(--grid) 48%, transparent 48.4%),
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 72px 72px, 72px 72px;
      background-position: center;
    }
    .signal-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mute);
    }
    header {
      position: relative;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      padding: 12px 16px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-name { font-size: 13px; font-weight: 500; letter-spacing: -0.02em; }
    .signal-live {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 999px;
      background: var(--amber);
      box-shadow: 0 0 8px rgba(255, 178, 77, 0.35);
      animation: signal-ekg 2.4s linear infinite;
    }
    @keyframes signal-ekg {
      0%, 16% { opacity: 0.18; transform: scale(1); }
      20% { opacity: 1; transform: scale(1.05); }
      26% { opacity: 0.2; transform: scale(1); }
      32% { opacity: 1; transform: scale(1.05); }
      40%, 100% { opacity: 0.18; transform: scale(1); }
    }
    .dead {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 8px;
    }
    form { display: flex; flex: 1; min-width: 220px; max-width: 28rem; gap: 8px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--void);
      color: var(--ink);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 14px;
      padding: 6px 12px;
    }
    input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
    .ask, select {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--void);
      color: var(--ink);
      padding: 6px 12px;
    }
    .refresh { background: none; border: 0; padding: 6px 8px; color: var(--mute); cursor: pointer; }
    .stage { position: relative; flex: 1; min-height: 0; }
    main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    svg { width: 100%; height: 100%; display: block; }
    .signal-sweep {
      pointer-events: none;
      position: absolute;
      inset: -35%;
      background: conic-gradient(from -90deg, transparent 0 76%, rgba(148,163,184,0.16) 84%, transparent 93%);
      animation: signal-sweep 1.8s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
    }
    @keyframes signal-sweep {
      from { transform: rotate(0deg); opacity: 0.75; }
      to { transform: rotate(360deg); opacity: 0; }
    }
    aside {
      position: absolute;
      right: 12px; top: 12px;
      width: min(24rem, 92vw);
      height: calc(100% - 24px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 20px;
      z-index: 10;
    }
    .tick { position: absolute; left: 0; top: 20px; width: 2px; height: 16px; background: var(--amber); }
    h2 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -0.03em; }
    .block { margin-top: 20px; }
    .block + .block { margin-top: 16px; }
    .meter { display: flex; align-items: flex-end; gap: 1px; height: 16px; }
    .meter span { width: 1px; background: #2a3245; }
    .meter span.on { background: var(--ink); }
    .src { display: flex; align-items: center; gap: 6px; }
    a.receipt {
      display: flex; gap: 8px; align-items: flex-start;
      color: var(--ink); text-decoration: none; margin-top: 12px; font-size: 14px;
    }
    a.receipt:hover { text-decoration: underline; text-decoration-color: var(--amber); text-underline-offset: 4px; }
    .banner {
      position: relative; z-index: 20;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      padding: 8px 16px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
    }
    @media (prefers-reduced-motion: reduce) {
      .signal-live { animation: none; opacity: 1; }
      .signal-sweep { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="signal-void" aria-hidden="true"></div>
    <div class="banner">Style preview · tokens from app/globals.css · not live /api/trends</div>
    <header>
      <div class="brand">
        <span class="signal-live" aria-label="Live"></span>
        <span class="brand-name">HAWKXAI</span>
      </div>
      <span class="signal-label" style="font-variant-numeric: tabular-nums;">8 / 1:03:18 PM CDT</span>
      <span class="signal-label dead">REDDIT: NO SIGNAL</span>
      <select class="signal-label" aria-label="City">
        <option>All</option>
        <option>Austin</option>
      </select>
      <form onsubmit="return false">
        <input placeholder="ask /" />
        <button class="ask signal-label" type="submit">Ask</button>
      </form>
      <button class="refresh signal-label" type="button">Refresh</button>
    </header>
    <div class="stage" id="stage">
      <svg id="map" role="img" aria-label="HawkxAI style pack"></svg>
      <div class="signal-sweep" aria-hidden="true"></div>
      <aside>
        <span class="tick" aria-hidden="true"></span>
        <h2>Selected topic</h2>
        <div class="block">
          <p class="signal-label">Detected</p>
          <p class="signal-label" style="color: var(--amber); margin: 8px 0 0;">Rising</p>
        </div>
        <div class="block">
          <p class="signal-label">Spread</p>
          <div style="display:flex;align-items:center;gap:12px;margin-top:8px;">
            <div class="meter" id="meter"></div>
            <span class="signal-label" style="color: var(--ink);">X-only bubble</span>
          </div>
        </div>
        <div class="block">
          <p class="signal-label">Sources</p>
          <div style="display:flex;gap:12px;margin-top:8px;">
            <div class="src"><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#46506b" stroke-width="1.4"/></svg><span class="signal-label" style="color:var(--ink);">72</span></div>
            <div class="src"><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#46506b" stroke-width="1.4" stroke-dasharray="5 3"/></svg><span class="signal-label" style="color:var(--ink);">18</span></div>
            <div class="src"><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#46506b" stroke-width="1.4" stroke-dasharray="1.5 2.4"/></svg><span class="signal-label" style="color:var(--ink);">9</span></div>
          </div>
        </div>
        <div class="block">
          <p class="signal-label">Receipts</p>
          <a class="receipt" href="#" onclick="return false">
            <svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#46506b" stroke-width="1.4"/></svg>
            <span>Receipt title · hover shows amber underline</span>
          </a>
        </div>
      </aside>
    </div>
  </main>
  <script src="/node_modules/d3/dist/d3.min.js"></script>
  <script>
    const meter = document.getElementById("meter");
    for (let i = 0; i < 24; i++) {
      const s = document.createElement("span");
      s.style.height = (i % 4 === 0 ? 14 : 9) + "px";
      if (i < 18) s.className = "on";
      meter.appendChild(s);
    }

    const stage = document.getElementById("stage");
    const svgEl = document.getElementById("map");
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    const svg = d3.select(svgEl).attr("viewBox", `0 0 ${width} ${height}`);
    const g = svg.append("g");
    const cx = width / 2, cy = height / 2, maxR = Math.hypot(width, height) * 0.7;
    const grid = g.append("g");
    for (let r = 72; r < maxR; r += 72) {
      grid.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r)
        .attr("fill", "none").attr("stroke", "rgba(148,163,184,0.05)");
    }
    grid.append("line").attr("x1", cx - maxR).attr("x2", cx + maxR).attr("y1", cy).attr("y2", cy).attr("stroke", "rgba(148,163,184,0.05)");
    grid.append("line").attr("x1", cx).attr("x2", cx).attr("y1", cy - maxR).attr("y2", cy + maxR).attr("stroke", "rgba(148,163,184,0.05)");

    const topics = [
      { id: "a", label: "Rising", v: "rising", fade: false, value: 90 },
      { id: "b", label: "Peaking", v: "peaking", fade: false, value: 64 },
      { id: "c", label: "Fading", v: "fading", fade: true, value: 40 },
      { id: "d", label: "Slate", v: "peaking", fade: false, value: 52 },
      { id: "e", label: "Heat", v: "rising", fade: false, value: 78 },
      { id: "f", label: "Quiet", v: "peaking", fade: false, value: 36 },
      { id: "g", label: "Dim", v: "fading", fade: true, value: 28 },
      { id: "h", label: "Core", v: "peaking", fade: false, value: 48 },
    ].map((t) => ({
      ...t,
      children: [
        { platform: "x", value: t.value * 0.5 },
        { platform: "reddit", value: t.value * 0.3 },
        { platform: "hn", value: t.value * 0.2 },
      ],
    }));

    const root = d3.pack().size([width, height]).padding(6)(
      d3.hierarchy({ children: topics }).sum((d) => d.value || 0)
    );
    const nodes = g.selectAll("g.node").data(root.descendants().slice(1)).join("g")
      .attr("class", "node")
      .attr("transform", (d) => `translate(${d.x},${d.y})`);

    function dash(d) {
      if (d.data.platform === "reddit") return "5 3";
      if (d.data.platform === "hn") return "1.5 2.4";
      return null;
    }
    function stroke(d) {
      if (d.data.platform) return "#46506b";
      if (d.data.v === "rising") return "#ff7a18";
      return "#46506b";
    }
    function fill(d) {
      const t = (d.value || 20) / 90;
      const lift = Math.round(t * 28);
      return `rgb(${42 + lift},${50 + lift},${69 + lift})`;
    }

    nodes.append("circle")
      .attr("r", 0)
      .attr("fill", fill)
      .attr("stroke", stroke)
      .attr("stroke-width", (d) => (d.data.v === "rising" ? 2.2 : 1.2))
      .attr("stroke-dasharray", dash)
      .attr("opacity", 0)
      .transition().duration(420).delay((_, i) => i * 50).ease(d3.easeCubicOut)
      .attr("r", (d) => d.r)
      .attr("opacity", (d) => (d.data.fade ? 0.45 : 1));

    nodes.filter((d) => d.data.label && d.r > 28)
      .append("text")
      .attr("text-anchor", "middle")
      .attr("dy", "0.35em")
      .attr("fill", "#f4f1ea")
      .attr("fill-opacity", 0.92)
      .attr("font-size", (d) => Math.min(13, d.r / 4))
      .attr("opacity", 0)
      .text((d) => d.data.label)
      .transition().delay(2000).duration(180).attr("opacity", 0.92);

    const rising = nodes.filter((d) => d.data.v === "rising").nodes().slice(0, 6);
    rising.forEach((el, i) => {
      const host = d3.select(el);
      const d = host.datum();
      const fire = () => {
        host.append("circle")
          .attr("r", d.r).attr("fill", "none").attr("stroke", "#ffb24d")
          .attr("stroke-width", 1.25).attr("opacity", 0.85)
          .style("pointer-events", "none")
          .transition().duration(3000).ease(d3.easeCubicOut)
          .attr("r", d.r * 2.2).attr("opacity", 0).remove();
      };
      setTimeout(() => { fire(); setInterval(fire, 3000); }, i * 400);
    });
  </script>
</body>
</html>
