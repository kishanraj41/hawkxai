name: Docker CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  docker-ci:
    name: Build image · Bug Bot · review · auto-PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dockerfile contract tests
        run: python3 -m unittest agents/docker-ci/tests/test_ci_agent.py

      - name: Hadolint
        continue-on-error: true
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hawkai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker CI agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >
          python3 agents/docker-ci/ci_agent.py
          --skip-build
          --image hawkai:ci
          --event ${{ github.event_name }}
          --ensure-pr
          ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '' }}

      - name: Upload agent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-ci-reports
          path: |
            agents/docker-ci/reports/
            agents/bug-bot/reports/
          if-no-files-found: ignore
          retention-days: 14
