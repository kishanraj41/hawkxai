# Docker CI agent — used as the documented contract.
# The agent ships matching defaults so CI does not require PyYAML.

image: hawkxai:ci
dockerfile: Dockerfile
smoke:
  port: 3000
  timeout_seconds: 60
  path: /
bugbot:
  scan:
    - app
    - lib
    - components
  fail_on: critical
review:
  run_on: pull_request
  blocking: false
auto_pr:
  on: push
  base: main
  skip_branches:
    - main
    - master
  skip_prefixes:
    - dependabot/
    - renovate/
dockerfile_contract:
  require_nonroot_user: true
  forbid_secret_env: true
  prefer_multistage: true
